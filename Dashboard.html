<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#f5f5f5; padding:24px; color:#1e293b; }
    h2 { color:#1a73e8; margin-bottom:14px; }
    .btn { background:#1a73e8; color:#fff; border:none; padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer; margin-bottom:16px; }
    .btn:hover { background:#1557b0; }
    .summary { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    .card { background:#fff; border-radius:8px; padding:12px 16px; box-shadow:0 1px 3px rgba(0,0,0,.12); min-width:120px; text-align:center; }
    .card .count { font-size:20px; font-weight:bold; color:#1a73e8; }
    .card .label { font-size:11px; color:#666; margin-top:2px; }
    input[type=text] { padding:8px; border:1px solid #ccc; border-radius:6px; font-size:14px; width:260px; margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; background:#fff; font-size:12px; }
    th, td { padding:8px; border:1px solid #e2e8f0; text-align:left; }
    th { background:#1a73e8; color:#fff; position:sticky; top:0; }
    td.done { color:#2d9249; font-weight:bold; }
    td.pending { color:#cbd5e1; }
    .tablewrap { max-height:60vh; overflow:auto; border:1px solid #e2e8f0; }
  </style>
</head>
<body>
  <a href="<?= scriptUrl ?>?page=generator" target="_top" style="font-size:13px; color:#1a73e8; text-decoration:none;">&larr; Guest &amp; QR Generator</a>
  <h2>Entry Tracking Dashboard</h2>
  <button class="btn" onclick="load()">Refresh</button>
  <a class="btn" style="display:inline-block; text-decoration:none;" href="<?= scriptUrl ?>?action=exportXlsx" target="_blank">Download Excel</a>
  <div class="summary" id="summary"></div>
  <input type="text" id="search" placeholder="Search guest name, email, or ID..." onkeyup="filterTable()">
  <div class="tablewrap">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"><tr><td>Loading...</td></tr></tbody>
    </table>
  </div>

  <script>
    let currentData = null;

    // scriptUrl is templated in from the server (same URL used for
    // ?action=search, ?action=exportXlsx, etc). Fetching it directly avoids
    // google.script.run's iframe messaging bridge, which some browsers can
    // block or hang on indefinitely with no visible error.
    const SCRIPT_URL = "<?= scriptUrl ?>";

    function load() {
      document.getElementById('body').innerHTML = '<tr><td>Loading...</td></tr>';
      fetch(SCRIPT_URL + '?action=dashboardData')
        .then(res => res.json())
        .then(data => {
          if (data.status !== 'ok') throw new Error(data.message || 'Unknown error');
          render(data);
        })
        .catch(showError);
    }

    function render(data) {
      currentData = data;
      const labels = data.dayLabels || ['Day 1', 'Day 2', 'Day 3'];
      const summary = document.getElementById('summary');
      summary.innerHTML =
        '<div class="card"><div class="count">' + data.totalGuests + '</div><div class="label">Total Guests</div></div>' +
        '<div class="card"><div class="count">' + data.summary.day1CheckedIn + '</div><div class="label">' + labels[0] + '</div></div>' +
        '<div class="card"><div class="count">' + data.summary.day2CheckedIn + '</div><div class="label">' + labels[1] + '</div></div>' +
        '<div class="card"><div class="count">' + data.summary.day3CheckedIn + '</div><div class="label">' + labels[2] + '</div></div>';

      const head = document.getElementById('headRow');
      head.innerHTML = '<th>Guest ID</th><th>Name</th><th>Email</th><th>Role</th><th>Affiliation</th><th>Enrollment ID</th><th>University</th>' +
        '<th>' + labels[0] + '</th><th>' + labels[1] + '</th><th>' + labels[2] + '</th>';

      renderRows(data.guests);
    }

    function dayCell(iso) {
      return iso
        ? '<td class="done">&#10003; ' + new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</td>'
        : '<td class="pending">&mdash;</td>';
    }

    function renderRows(guests) {
      const body = document.getElementById('body');
      if (!guests.length) { body.innerHTML = '<tr><td>No guests yet — add some on the Generator page.</td></tr>'; return; }
      body.innerHTML = guests.map(g => {
        return '<tr><td>' + g.guestId + '</td><td>' + g.name + '</td><td>' + (g.email || '') + '</td>' +
          '<td>' + (g.role || '') + '</td><td>' + (g.affiliation || '') + '</td>' +
          '<td>' + (g.enrollmentId || '') + '</td><td>' + (g.university || '') + '</td>' +
          dayCell(g.day1Entry) + dayCell(g.day2Entry) + dayCell(g.day3Entry) + '</tr>';
      }).join('');
    }

    function filterTable() {
      const q = document.getElementById('search').value.toLowerCase();
      if (!currentData) return;
      const filtered = currentData.guests.filter(g =>
        g.name.toLowerCase().includes(q) ||
        (g.email || '').toLowerCase().includes(q) ||
        g.guestId.toLowerCase().includes(q) ||
        (g.enrollmentId || '').toLowerCase().includes(q) ||
        (g.university || '').toLowerCase().includes(q)
      );
      renderRows(filtered);
    }

    function showError(err) {
      document.getElementById('body').innerHTML = '<tr><td style="color:red">Error: ' + err.message + '</td></tr>';
    }

    load();
  </script>
</body>
</html>
